<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Videos</title>
<style>
    /* Estilos básicos para la página */
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    h1 {
        text-align: center;
        margin-bottom: 40px;
    }

    /* Estilo para los títulos de cada fila */
    .titulo-fila {
        text-align: center;
        font-size: 1.5rem;
        margin-top: 30px;
        margin-bottom: 15px;
        color: #0056b3;
        width: 100%;
    }

    /* CAMBIO PRINCIPAL: Usamos Flexbox alineando al estiramiento */
    .fila-videos {
        display: flex;
        justify-content: center;
        align-items: stretch; /* Fuerza a que los dos bloques midan lo mismo de alto */
        gap: 20px; /* Espacio entre los videos */
        max-width: 1200px; /* Un poco más ancho para que quepan bien los dos gráficos */
        margin: 0 auto 50px auto;
    }

    /* Contenedor individual para cada video */
    .video-contenedor {
        flex: 1; /* Hace que las dos columnas tengan exactamente el mismo ancho */
        display: flex;
        flex-direction: column;
        background-color: #ffffff; /* Fondo blanco para rellenar si un video es milimétricamente más chico */
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 10px; /* Espacio interno de cortesía */
        box-sizing: border-box;
    }

    /* Ajuste perfecto para el reproductor de video */
    .video-contenedor video {
        width: 100%;
        height: 100%;
        object-fit: contain; /* Garantiza que el gráfico NO se corte ni se deforme */
        border-radius: 4px;
        background-color: #fff; /* Fondo blanco detrás del video si sobra espacio */
    }

    /* Adaptación para pantallas pequeñas (celulares) */
    @media (max-width: 768px) {
        .fila-videos {
            flex-direction: column; /* Se apilan uno abajo del otro en el celular */
        }
    }
</style>


</head>
<body> 

    <h1>¡Hola Mundo! Mi galería de videos.</h1>
