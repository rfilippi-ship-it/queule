<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Videos</title>
<style>
    /* Estilos básicos para la página */
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    h1 {
        text-align: center;
        margin-bottom: 40px;
    }

    /* Estilo para los títulos de cada fila */
    .titulo-fila {
        text-align: center;
        font-size: 1.5rem;
        margin-top: 40px;
        margin-bottom: 15px;
        color: #0056b3;
        width: 100%;
    }

    /* Contenedor flexible centrado */
    .fila-videos {
        display: flex;
        justify-content: center; /* Centra los videos horizontalmente si sobra espacio */
        align-items: center;     /* Alinea los videos perfectamente por su centro vertical */
        gap: 30px;               /* Espacio generoso entre los dos videos */
        max-width: 95%;          /* Usa casi todo el ancho de la pantalla */
        margin: 0 auto 40px auto;
    }

    /* CONFIGURACIÓN CLAVE: Altura fija idéntica para todos los videos */
    .fila-videos video {
        height: 420px;           /* Modifica este valor (ej. 450px o 500px) para cambiar el tamaño general */
        width: auto;             /* Deja que el ancho se calcule solo según el video original */
        max-width: 100%;         /* Evita que se salga de la pantalla en monitores chicos */
        
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        border-radius: 6px;
        background-color: #fff;  /* Fondo blanco limpio */
    }

    /* Adaptación para dispositivos móviles */
    @media (max-width: 900px) {
        .fila-videos {
            flex-direction: column; /* En pantallas pequeñas se ponen uno abajo del otro */
            align-items: center;
        }
        .fila-videos video {
            height: auto;        /* En celulares dejamos que el ancho mande para que no se corten */
            width: 100%;
        }
    }
</style>


</head>
<body> 

    <h1>¡Hola Mundo! Mi galería de videos.</h1>

    <!-- ================= FILA 1 ================= -->
    <h2 class="titulo-fila">Título de la Fila 1</h2>
    <div class="fila-videos">

       <video src="final/cas_0/c0_7d_hs_59_q7_nw_tp_14/video_evolucion_fondo_GAIA_-2a2_isolineas0p5.mp4" controls></video>
    </div>

    <!-- ================= FILA 2 ================= -->

        <video src="final/cas_0/c0_7d_hs_59_q7_nw_tp_14/video_evolucion_fondo_GAIA_-2a2_isolineas0p5.mp4" controls></video>

    <!-- ================= FILA 3 ================= -->
