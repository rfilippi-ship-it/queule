<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Videos</title>
    <style>
        /* Estilos básicos para la página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Estilo para los títulos de cada fila */
        .titulo-fila {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #0056b3;
            width: 100%;
        }

        /* Contenedor de la fila (actúa como una rejilla de 2 columnas) */
        .fila-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Crea 2 columnas iguales */
            gap: 20px; /* Espacio entre los videos */
            max-width: 1000px;
            margin: 0 auto 50px auto; /* Centra la fila y da espacio abajo */
        }

        /* Estilo para cada reproductor de video */
        .fila-videos video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #000;
        }

        /* Adaptación para pantallas pequeñas (celulares) */
        @media (max-width: 768px) {
            .fila-videos {
                grid-template-columns: 1fr; /* Pasa a 1 sola columna en pantallas chicas */
            }
        }
    </style>
</head>
<body> 

    <h1>¡Hola Mundo! Mi galería de videos.</h1>

    <!-- ================= FILA 1 ================= -->
    <h2 class="titulo-fila">Título de la Fila 1</h2>

        <video src="final/cas_0/c0_7d_hs_59_q7_nw_tp_14/corrientes_teleMAC.mp4" controls></video>
    </div>

        <video src="final/cas_0/c0_7d_hs_59_q7_nw_tp_14/corrientes_teleMAC.mp4" controls></video>
    </div>

    <!-- ================= FILA 3 ================= -->
    <h2 class="titulo-fila">Título de la Fila 3</h2>
    <div class="fila-videos">
        <video src="final/cas_0/c0_7d_hs_59_q7_nw_tp_14/corrientes_teleMAC.mp4" controls></video>

</body>
</html>
